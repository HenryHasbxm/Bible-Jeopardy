<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Jeopardy</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #f1c40f;
            margin-bottom: 20px;
        }
        
        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .testament-col {
            flex: 1;
            background-color: #16213e;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #0f3460;
        }
        .testament-col h2 {
            text-align: center;
            color: #e94560;
            border-bottom: 2px solid #e94560;
            padding-bottom: 10px;
        }
        
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
            margin-top: 15px;
        }
        .book-btn {
            background-color: #0f3460;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
            transition: background 0.2s;
        }
        .book-btn:hover {
            background-color: #e94560;
        }

        /* Overlay & Modals */
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background-color: #16213e;
            padding: 25px;
            border-radius: 8px;
            max-width: 650px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            text-align: center;
            border: 2px solid #f1c40f;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.2);
        }
        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .chapter-btn {
            background-color: #0f3460;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .chapter-btn:hover {
            background-color: #f1c40f;
            color: #000;
        }

        /* Teams Management Bar */
        .team-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background-color: #0f3460;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .team-card {
            background-color: #16213e;
            padding: 8px 15px;
            border-radius: 6px;
            border: 2px solid #27ae60;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }
        .team-score {
            color: #f1c40f;
            font-size: 1.1em;
        }
        .btn-small {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        /* Jeopardy Board Layout */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: #0f3460;
            padding: 12px 20px;
            border-radius: 5px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 950px;
            margin: 0 auto;
        }
        .category-header {
            background-color: #06101e;
            color: #f1c40f;
            padding: 15px 5px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid #0f3460;
            border-radius: 4px;
        }
        .clue-card {
            background-color: #0f3460;
            color: #f1c40f;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: transform 0.2s, background-color 0.2s;
        }
        .clue-card:hover {
            background-color: #1a508b;
            transform: scale(1.02);
        }
        .clue-card.disabled {
            background-color: #111a2e;
            color: #334155;
            cursor: not-allowed;
            transform: none;
        }

        .team-assign-grid {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .btn-correct { background-color: #27ae60; color: white; }
        .btn-wrong { background-color: #c0392b; color: white; }
        
        .btn-close {
            background-color: #e94560;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Bible Jeopardy</h1>

    <!-- Scoreboard / Teams Header -->
    <div class="team-bar">
        <span style="font-weight: bold; color: #f1c40f;">TEAMS:</span>
        <div id="teams-list" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
        <button class="btn-small" style="background-color: #27ae60;" onclick="addTeam()">+ Add Team</button>
    </div>

    <!-- MAIN VIEW: Books split OT (Left) & NT (Right) -->
    <div id="selection-view" class="container">
        <div class="testament-col">
            <h2>Old Testament</h2>
            <div id="ot-grid" class="book-grid"></div>
        </div>
        
        <div class="testament-col">
            <h2>New Testament</h2>
            <div id="nt-grid" class="book-grid"></div>
        </div>
    </div>

    <!-- Chapter Modal -->
    <div id="chapter-modal" class="overlay">
        <div class="modal">
            <h2 id="modal-book-title">Select Chapter</h2>
            <div id="chapter-grid" class="chapter-grid"></div>
            <br>
            <button class="btn-close" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <!-- Jeopardy Board View -->
    <div id="jeopardy-view" style="display: none;">
        <div class="game-header">
            <button class="btn-close" onclick="exitGame()">← Back to Books</button>
            <h2 id="game-title" style="margin: 0; color: #f1c40f;"></h2>
            <div></div>
        </div>
        <div class="board" id="board"></div>
    </div>

    <!-- Question/Answer Modal -->
    <div id="clue-modal" class="overlay">
        <div class="modal">
            <h3 id="clue-value" style="color:#f1c40f; font-size: 24px;"></h3>
            <p id="clue-text" style="font-size: 20px; margin: 20px 0; line-height: 1.4;"></p>
            
            <div id="answer-section" style="display:none; margin: 20px 0; padding: 15px; background: #0f3460; border-radius: 6px;">
                <p style="color: #aaa; margin-bottom: 5px;">ANSWER:</p>
                <p id="answer-text" style="color: #4ecca3; font-weight: bold; font-size: 20px;"></p>
            </div>

            <button id="show-answer-btn" class="book-btn" style="font-size: 16px; padding: 10px 20px;" onclick="revealAnswer()">Show Answer</button>

            <!-- Multi-team scoring options -->
            <div id="score-controls" style="display:none; flex-direction: column; gap: 10px; margin-top:15px;">
                <p style="font-size: 14px; color: #ccc;">Award or Deduct points for a team:</p>
                <div id="team-score-buttons" class="team-assign-grid"></div>
                <br>
                <button class="btn-close" onclick="closeClueModal()">Close Clue</button>
            </div>
        </div>
    </div>

    <script>
        // 66 Books of the Bible Data
        const oldTestament = {
            "Genesis": 50, "Exodus": 40, "Leviticus": 27, "Numbers": 36, "Deuteronomy": 34,
            "Joshua": 24, "Judges": 21, "Ruth": 4, "1 Samuel": 31, "2 Samuel": 24,
            "1 Kings": 22, "2 Kings": 25, "1 Chronicles": 29, "2 Chronicles": 36, "Ezra": 10,
            "Nehemiah": 13, "Esther": 10, "Job": 42, "Psalms": 150, "Proverbs": 31,
            "Ecclesiastes": 12, "Song of Solomon": 8, "Isaiah": 66, "Jeremiah": 52, "Lamentations": 5,
            "Ezekiel": 48, "Daniel": 12, "Hosea": 14, "Joel": 3, "Amos": 9,
            "Obadiah": 1, "Jonah": 4, "Micah": 7, "Nahum": 3, "Habakkuk": 3,
            "Zephaniah": 3, "Haggai": 2, "Zechariah": 14, "Malachi": 4
        };

        const newTestament = {
            "Matthew": 28, "Mark": 16, "Luke": 24, "John": 21, "Acts": 28,
            "Romans": 16, "1 Corinthians": 16, "2 Corinthians": 13, "Galatians": 6, "Ephesians": 6,
            "Philippians": 4, "Colossians": 4, "1 Thessalonians": 5, "2 Thessalonians": 3, "1 Timothy": 6,
            "2 Timothy": 4, "Titus": 3, "Philemon": 1, "Hebrews": 13, "James": 5,
            "1 Peter": 5, "2 Peter": 3, "1 John": 5, "2 John": 1, "3 John": 1,
            "Jude": 1, "Revelation": 22
        };

        // Specific Questions Database for major chapters
        const chapterDatabase = {
            "Genesis 1": [
                { cat: "Creation", val: 100, q: "What did God create on the first day?", a: "Light (and separated it from darkness)" },
                { cat: "Creation", val: 200, q: "On which day did God create land animals and humans?", a: "The Sixth Day" },
                { cat: "Key Details", val: 300, q: "According to Genesis 1:26, in whose image was mankind made?", a: "In God's image and likeness" }
            ],
            "Genesis 2": [
                { cat: "Garden of Eden", val: 100, q: "What did God do on the seventh day after finishing creation?", a: "He rested and made the seventh day holy" },
                { cat: "People & Places", val: 200, q: "From what material did God form the first man?", a: "The dust of the ground" },
                { cat: "Key Details", val: 300, q: "What tree was Adam forbidden to eat from?", a: "The Tree of the Knowledge of Good and Evil" }
            ],
            "Genesis 3": [
                { cat: "The Fall", val: 100, q: "Which creature deceived Eve in the Garden?", a: "The Serpent" },
                { cat: "Key Details", val: 200, q: "How did Adam and Eve cover themselves after realizing they were naked?", a: "They sewed fig leaves together" },
                { cat: "Consequences", val: 300, q: "What did God place at the east of Eden to guard the tree of life?", a: "Cherubim and a flaming sword" }
            ],
            "Matthew 1": [
                { cat: "Genealogy", val: 100, q: "Whose family line is traced at the opening of Matthew 1?", a: "Jesus Christ (son of David, son of Abraham)" },
                { cat: "Prophecy", val: 200, q: "What name meaning 'God with us' was given to Jesus in verse 23?", a: "Immanuel" },
                { cat: "Key Details", val: 300, q: "An angel appeared to Joseph in a what, telling him not to fear taking Mary as his wife?", a: "A Dream" }
            ],
            "Luke 2": [
                { cat: "Nativity", val: 100, q: "In what town was Jesus born according to Luke 2?", a: "Bethlehem" },
                { cat: "People", val: 200, q: "Who were keeping watch over their flock by night when angels appeared?", a: "The Shepherds" },
                { cat: "Temple Events", val: 300, q: "What devout man in the temple praised God after seeing the baby Jesus?", a: "Simeon" }
            ],
            "John 1": [
                { cat: "The Word", val: 100, q: "What was 'in the beginning' according to John 1:1?", a: "The Word (Logos)" },
                { cat: "John the Baptist", val: 200, q: "What title did John the Baptist give Jesus when he saw Him coming?", a: "The Lamb of God" },
                { cat: "Disciples", val: 300, q: "Under what type of tree did Jesus say He saw Nathanael before Philip called him?", a: "A Fig Tree" }
            ],
            "Revelation 22": [
                { cat: "New Jerusalem", val: 100, q: "What flows from the throne of God down the middle of the city street?", a: "The River of the Water of Life" },
                { cat: "Titles of Christ", val: 200, q: "Jesus declares in verse 13: 'I am the ____ and the ____, the First and the Last.'", a: "Alpha and Omega" },
                { cat: "Closing", val: 300, q: "What is the very last sentence/prayer in Revelation 22?", a: "'The grace of the Lord Jesus be with God's people. Amen.'" }
            ]
        };

        // State variables
        let teams = [{ name: "Team 1", score: 0 }, { name: "Team 2", score: 0 }];
        let selectedBook = "";
        let selectedChapter = 0;
        let currentClueValue = 0;
        let activeCardElement = null;

        // Initialize App
        function init() {
            renderTeams();
            const otGrid = document.getElementById("ot-grid");
            const ntGrid = document.getElementById("nt-grid");

            for (let book in oldTestament) {
                otGrid.appendChild(createBookButton(book, oldTestament[book]));
            }
            for (let book in newTestament) {
                ntGrid.appendChild(createBookButton(book, newTestament[book]));
            }
        }

        // Team Management
        function renderTeams() {
            const list = document.getElementById("teams-list");
            list.innerHTML = "";
            teams.forEach((team, index) => {
                const card = document.createElement("div");
                card.className = "team-card";
                card.innerHTML = `
                    <span>${team.name}:</span>
                    <span class="team-score">$${team.score}</span>
                    <button class="btn-small" onclick="removeTeam(${index})">✕</button>
                `;
                list.appendChild(card);
            });
        }

        function addTeam() {
            const name = prompt("Enter team name:", `Team ${teams.length + 1}`);
            if (name) {
                teams.push({ name: name, score: 0 });
                renderTeams();
            }
        }

        function removeTeam(index) {
            if (teams.length <= 1) {
                alert("You must have at least one team.");
                return;
            }
            teams.splice(index, 1);
            renderTeams();
        }

        // Book & Chapter Selection
        function createBookButton(name, chapters) {
            const btn = document.createElement("button");
            btn.className = "book-btn";
            btn.innerText = name;
            btn.onclick = () => openChapterModal(name, chapters);
            return btn;
        }

        function openChapterModal(bookName, chapterCount) {
            selectedBook = bookName;
            document.getElementById("modal-book-title").innerText = `${bookName} - Choose Chapter`;
            const grid = document.getElementById("chapter-grid");
            grid.innerHTML = "";

            for (let i = 1; i <= chapterCount; i++) {
                const btn = document.createElement("button");
                btn.className = "chapter-btn";
                btn.innerText = i;
                btn.onclick = () => startGame(i);
                grid.appendChild(btn);
            }

            document.getElementById("chapter-modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("chapter-modal").style.display = "none";
        }

        // Start Jeopardy Game
        function startGame(chapter) {
            selectedChapter = chapter;
            closeModal();
            
            document.getElementById("selection-view").style.display = "none";
            document.getElementById("jeopardy-view").style.display = "block";
            document.getElementById("game-title").innerText = `${selectedBook} ${selectedChapter}`;
            
            buildBoard();
        }

        function exitGame() {
            document.getElementById("jeopardy-view").style.display = "none";
            document.getElementById("selection-view").style.display = "flex";
        }

        // Build Jeopardy Board
        function buildBoard() {
            const board = document.getElementById("board");
            board.innerHTML = "";

            const categories = ["Key Events", "People & Words", "Chapter Details"];
            
            // Header Row
            categories.forEach(cat => {
                const header = document.createElement("div");
                header.className = "category-header";
                header.innerText = cat;
                board.appendChild(header);
            });

            // Get specific clues if available, otherwise generate contextual fallback questions
            const key = `${selectedBook} ${selectedChapter}`;
            const specificClues = chapterDatabase[key];

            const values = [100, 200, 300];
            
            values.forEach((val, valIdx) => {
                categories.forEach((cat, catIdx) => {
                    const card = document.createElement("div");
                    card.className = "clue-card";
                    card.innerText = `$${val}`;
                    card.dataset.value = val;

                    let clueObj;
                    if (specificClues && specificClues[valIdx * 3 + catIdx]) {
                        clueObj = specificClues[valIdx * 3 + catIdx];
                    } else {
                        // Contextual fallback generation for any chapter in the Bible
                        clueObj = generateDynamicClue(selectedBook, selectedChapter, cat, val);
                    }

                    card.dataset.clue = clueObj.q;
                    card.dataset.answer = clueObj.a;

                    card.onclick = () => openClue(card);
                    board.appendChild(card);
                });
            });
        }

        function generateDynamicClue(book, chapter, category, value) {
            if (value === 100) {
                return {
                    q: `What general testament and book contains the scripture verse ${book} chapter ${chapter}?`,
                    a: `The book of ${book} in the ${oldTestament[book] ? 'Old Testament' : 'New Testament'}.`
                };
            } else if (value === 200) {
                return {
                    q: `In ${book} Chapter ${chapter}, what is the central event, teaching, or theme presented in this section?`,
                    a: `Key narrative/doctrine recorded in ${book} chapter ${chapter}.`
                };
            } else {
                return {
                    q: `Recite or summarize a key verse or major figure prominent in ${book} Chapter ${chapter}.`,
                    a: `Major quote or figure featured in ${book} ${chapter}.`
                };
            }
        }

        // Clue Display & Multi-Team Score Logic
        function openClue(card) {
            if (card.classList.contains("disabled")) return;
            
            activeCardElement = card;
            currentClueValue = parseInt(card.dataset.value);

            document.getElementById("clue-value").innerText = `$${currentClueValue}`;
            document.getElementById("clue-text").innerText = card.dataset.clue;
            document.getElementById("answer-text").innerText = card.dataset.answer;
            
            document.getElementById("answer-section").style.display = "none";
            document.getElementById("show-answer-btn").style.display = "inline-block";
            document.getElementById("score-controls").style.display = "none";

            document.getElementById("clue-modal").style.display = "flex";
        }

        function revealAnswer() {
            document.getElementById("answer-section").style.display = "block";
            document.getElementById("show-answer-btn").style.display = "none";
            
            // Build buttons for each team to score
            const container = document.getElementById("team-score-buttons");
            container.innerHTML = "";

            teams.forEach((team, index) => {
                const teamDiv = document.createElement("div");
                teamDiv.style.display = "flex";
                teamDiv.style.gap = "5px";
                teamDiv.innerHTML = `
                    <button class="book-btn btn-correct" onclick="awardScore(${index}, true)">${team.name} (+ $${currentClueValue})</button>
                    <button class="book-btn btn-wrong" onclick="awardScore(${index}, false)">${team.name} (- $${currentClueValue})</button>
                `;
                container.appendChild(teamDiv);
            });

            document.getElementById("score-controls").style.display = "flex";
        }

        function awardScore(teamIndex, isCorrect) {
            if (isCorrect) {
                teams[teamIndex].score += currentClueValue;
            } else {
                teams[teamIndex].score -= currentClueValue;
            }
            renderTeams();
            closeClueModal();
        }

        function closeClueModal() {
            if (activeCardElement) {
                activeCardElement.classList.add("disabled");
                activeCardElement.innerText = "";
                activeCardElement.onclick = null;
            }
            document.getElementById("clue-modal").style.display = "none";
        }

        // Launch app
        init();
    </script>
</body>
</html>
