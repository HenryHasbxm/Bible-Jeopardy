<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Jeopardy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
        }

        /* Custom Golden Glow & Dark Theme Utility Touches */
        .gold-glow {
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.25);
        }

        .gold-border {
            border-color: #eab308;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-yellow-500 selection:text-black">

    <!-- Header -->
    <header class="bg-slate-950 border-b border-slate-800 p-4 sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-yellow-500 rounded-lg flex items-center justify-center text-slate-950 font-black text-2xl shadow-md">
                    ✝
                </div>
                <h1 class="text-2xl font-black tracking-wider text-yellow-400 uppercase">
                    Bible Jeopardy
                </h1>
            </div>

            <!-- Teams Bar -->
            <div class="flex items-center gap-3 flex-wrap justify-center">
                <span class="text-xs uppercase font-bold tracking-widest text-slate-400">Teams:</span>
                <div id="teams-container" class="flex items-center gap-2 flex-wrap"></div>
                <button onclick="addTeam()" class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 px-3 py-1.5 rounded-lg font-bold text-xs transition flex items-center gap-1 shadow">
                    <span>+</span> Add Team
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col">
        
        <!-- Selection View (OT on Left, NT on Right) -->
        <div id="selection-view" class="flex-1 flex flex-col gap-6">
            <div class="text-center my-2">
                <p class="text-slate-400 text-sm">Select a book from the Old or New Testament to begin</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 flex-1">
                <!-- Old Testament (Left Side) -->
                <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 flex flex-col gold-glow">
                    <div class="flex items-center justify-between pb-3 mb-4 border-b border-amber-500/30">
                        <h2 class="text-xl font-bold text-amber-500 uppercase tracking-wider flex items-center gap-2">
                            <span>📜</span> Old Testament
                        </h2>
                        <span class="text-xs bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-full border border-amber-500/20 font-semibold">
                            39 Books
                        </span>
                    </div>
                    <div id="ot-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-2 overflow-y-auto max-h-[60vh] md:max-h-none custom-scrollbar pr-1"></div>
                </div>

                <!-- New Testament (Right Side) -->
                <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 flex flex-col gold-glow">
                    <div class="flex items-center justify-between pb-3 mb-4 border-b border-cyan-500/30">
                        <h2 class="text-xl font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-2">
                            <span>📖</span> New Testament
                        </h2>
                        <span class="text-xs bg-cyan-500/10 text-cyan-400 px-2.5 py-1 rounded-full border border-cyan-500/20 font-semibold">
                            27 Books
                        </span>
                    </div>
                    <div id="nt-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-2 overflow-y-auto max-h-[60vh] md:max-h-none custom-scrollbar pr-1"></div>
                </div>
            </div>
        </div>

        <!-- Jeopardy Game View -->
        <div id="game-view" class="hidden flex-1 flex flex-col gap-4">
            <div class="flex items-center justify-between bg-slate-900 p-4 rounded-xl border border-slate-800">
                <button onclick="exitGame()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg font-semibold text-sm transition flex items-center gap-2 border border-slate-700">
                    <span>←</span> Back to Books
                </button>
                <div class="text-center">
                    <h2 id="active-game-title" class="text-2xl font-black text-yellow-400 tracking-wide uppercase"></h2>
                    <p class="text-xs text-slate-400">Chapter Game Board</p>
                </div>
                <div id="game-status" class="text-xs text-slate-400 font-medium hidden sm:block">
                    Click a clue to play
                </div>
            </div>

            <!-- 3x3 Board Grid -->
            <div id="jeopardy-board" class="grid grid-cols-3 gap-3 md:gap-4 flex-1 my-auto max-w-4xl w-full mx-auto"></div>
        </div>
    </main>

    <!-- Chapter Selection Modal -->
    <div id="chapter-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-yellow-500/40 rounded-2xl max-w-lg w-full p-6 shadow-2xl flex flex-col gap-4 max-h-[85vh]">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="modal-book-title" class="text-xl font-bold text-yellow-400"></h3>
                <button onclick="closeChapterModal()" class="text-slate-400 hover:text-white text-xl font-bold">✕</button>
            </div>
            <p class="text-xs text-slate-400">Choose a chapter to open its Jeopardy game board:</p>
            <div id="chapter-grid" class="grid grid-cols-5 sm:grid-cols-6 gap-2 overflow-y-auto max-h-[50vh] custom-scrollbar p-1"></div>
            <div class="pt-2 border-t border-slate-800 flex justify-end">
                <button onclick="closeChapterModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm font-semibold transition">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- Clue / Question Modal -->
    <div id="clue-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-yellow-500 rounded-2xl max-w-2xl w-full p-6 shadow-2xl flex flex-col gap-6 gold-glow">
            
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <span id="clue-category-badge" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider"></span>
                <span id="clue-value-badge" class="text-yellow-400 font-black text-2xl"></span>
            </div>

            <!-- Question Prompt -->
            <div class="text-center py-4 px-2">
                <p id="clue-question" class="text-xl md:text-2xl font-bold text-slate-100 leading-relaxed"></p>
            </div>

            <!-- Revealed Answer Box -->
            <div id="answer-box" class="hidden bg-slate-950/80 border border-emerald-500/40 p-4 rounded-xl text-center flex flex-col gap-1">
                <span class="text-xs text-emerald-400 font-bold uppercase tracking-widest">Correct Answer</span>
                <p id="clue-answer" class="text-lg font-extrabold text-emerald-300"></p>
            </div>

            <!-- Action Controls -->
            <div class="flex flex-col gap-4 pt-2 border-t border-slate-800">
                <button id="show-answer-btn" onclick="revealAnswer()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-950 py-3 rounded-xl font-black text-base transition shadow-lg uppercase tracking-wide">
                    Reveal Answer
                </button>

                <div id="scoring-panel" class="hidden flex-col gap-3">
                    <p class="text-xs text-slate-400 text-center font-medium">Award or Deduct Points for Teams:</p>
                    <div id="team-score-buttons" class="flex flex-wrap justify-center gap-2"></div>
                    <button onclick="closeClueModal()" class="mt-2 w-full bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl font-semibold text-sm transition">
                        Done with Clue
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Complete Bible Books & Chapter Counts
        const oldTestament = {
            "Genesis": 50, "Exodus": 40, "Leviticus": 27, "Numbers": 36, "Deuteronomy": 34,
            "Joshua": 24, "Judges": 21, "Ruth": 4, "1 Samuel": 31, "2 Samuel": 24,
            "1 Kings": 22, "2 Kings": 25, "1 Chronicles": 29, "2 Chronicles": 36, "Ezra": 10,
            "Nehemiah": 13, "Esther": 10, "Job": 42, "Psalms": 150, "Proverbs": 31,
            "Ecclesiastes": 12, "Song of Solomon": 8, "Isaiah": 66, "Jeremiah": 52, "Lamentations": 5,
            "Ezekiel": 48, "Daniel": 12, "Hosea": 14, "Joel": 3, "Amos": 9,
            "Obadiah": 1, "Jonah": 4, "Micah": 7, "Nahum": 3, "Habakkuk": 3,
            "Zephaniah": 3, "Haggai": 2, "Zechariah": 14, "Malachi": 4
        };

        const newTestament = {
            "Matthew": 28, "Mark": 16, "Luke": 24, "John": 21, "Acts": 28,
            "Romans": 16, "1 Corinthians": 16, "2 Corinthians": 13, "Galatians": 6, "Ephesians": 6,
            "Philippians": 4, "Colossians": 4, "1 Thessalonians": 5, "2 Thessalonians": 3, "1 Timothy": 6,
            "2 Timothy": 4, "Titus": 3, "Philemon": 1, "Hebrews": 13, "James": 5,
            "1 Peter": 5, "2 Peter": 3, "1 John": 5, "2 John": 1, "3 John": 1,
            "Jude": 1, "Revelation": 22
        };

        // Custom Curated Questions for Famous Chapters
        const famousChaptersDatabase = {
            "Genesis 1": [
                { cat: "Creation", val: 100, q: "What did God command into existence on the very first day of Creation?", a: "Light ('Let there be light')" },
                { cat: "Order of Creation", val: 200, q: "On which day were the sun, moon, and stars created to govern day and night?", a: "The Fourth Day" },
                { cat: "Mankind", val: 300, q: "According to Genesis 1:27, in whose image did God create human beings?", a: "In God's own image" }
            ],
            "Genesis 3": [
                { cat: "The Temptation", val: 100, q: "Which craftiest of beasts persuaded Eve to eat fruit from the forbidden tree?", a: "The Serpent" },
                { cat: "The Fall", val: 200, q: "What material did Adam and Eve sew together to cover their nakedness?", a: "Fig leaves" },
                { cat: "Eden Guard", val: 300, q: "What heavenly beings and weapon were placed at the east of Eden to guard the Tree of Life?", a: "Cherubim and a flaming sword" }
            ],
            "Exodus 20": [
                { cat: "The Commandments", val: 100, q: "Where was Moses when God delivered the Ten Commandments in Exodus 20?", a: "Mount Sinai" },
                { cat: "The Law", val: 200, q: "Which commandment carries the promise of long life for honoring one's parents?", a: "The 5th Commandment ('Honor your father and mother')" },
                { cat: "Sabbath", val: 300, q: "How many days did the Lord labor in making heaven and earth before resting on the Sabbath?", a: "Six days" }
            ],
            "Psalms 23": [
                { cat: "The Shepherd", val: 100, q: "Complete the opening phrase of Psalm 23:1: 'The LORD is my shepherd; I shall not...'", a: "...want' (or 'lack nothing')" },
                { cat: "Valleys & Comfort", val: 200, q: "What two shepherd tools comfort the author while walking through the valley of the shadow of death?", a: "His rod and staff" },
                { cat: "The Feast", val: 300, q: "Where does the Lord prepare a table for the psalmist in Psalm 23:5?", a: "In the presence of my enemies" }
            ],
            "Matthew 1": [
                { cat: "Lineage", val: 100, q: "Which two prominent Old Testament patriarchs begin the genealogy of Jesus in Matthew 1:1?", a: "Abraham and King David" },
                { cat: "Prophecy", val: 200, q: "What Hebrew name meaning 'God with us' was prophesied for Jesus?", a: "Immanuel" },
                { cat: "Angelic Visit", val: 300, q: "How did the angel of the Lord appear to Joseph to reassure him regarding Mary?", a: "In a dream" }
            ],
            "Luke 2": [
                { cat: "The Birth", val: 100, q: "In which city of David was Jesus born due to the Roman census?", a: "Bethlehem" },
                { cat: "Night Watch", val: 200, q: "To whom did the angel of the Lord first announce the good news of great joy in the fields?", a: "The Shepherds" },
                { cat: "Temple Praise", val: 300, q: "What devout man took baby Jesus in his arms at the temple and blessed God?", a: "Simeon" }
            ],
            "John 1": [
                { cat: "The Logos", val: 100, q: "According to John 1:1, what was in the beginning with God and was God?", a: "The Word (Logos)" },
                { cat: "The Witness", val: 200, q: "What famous title did John the Baptist proclaim upon seeing Jesus in verse 29?", a: "'The Lamb of God who takes away the sin of the world!'" },
                { cat: "Disciples", val: 300, q: "Under what tree did Jesus see Nathanael before Philip called him?", a: "A fig tree" }
            ],
            "Acts 2": [
                { cat: "Pentecost", val: 100, q: "What manifestation appeared like tongues of fire resting on the believers at Pentecost?", a: "The Holy Spirit" },
                { cat: "Peter's Sermon", val: 200, q: "Which Old Testament prophet did Peter quote regarding the outpouring of the Spirit in the last days?", a: "The Prophet Joel" },
                { cat: "Early Church", val: 300, q: "How many souls were added to the church after Peter's sermon in Acts 2:41?", a: "About 3,000 souls" }
            ],
            "1 Corinthians 13": [
                { cat: "Love Chapter", val: 100, q: "If a person speaks in the tongues of men and angels but lacks love, what noisy instrument are they compared to?", a: "A clanging cymbal or resounding gong" },
                { cat: "Qualities", val: 200, q: "Name two of the four characteristics of love explicitly listed in 1 Corinthians 13:4.", a: "Love is patient, love is kind (does not envy, boast, etc.)" },
                { cat: "The Greatest", val: 300, q: "Three virtues remain: faith, hope, and love. Which does Paul declare as the greatest?", a: "Love" }
            ],
            "Revelation 22": [
                { cat: "River of Life", val: 100, q: "What flows from the throne of God down the middle of the city street in Revelation 22?", a: "The River of the Water of Life" },
                { cat: "Tree of Life", val: 200, q: "How many kinds of fruit does the Tree of Life yield each month in the New Jerusalem?", a: "Twelve crops of fruit (one each month)" },
                { cat: "Final Titles", val: 300, q: "What Greek title pair does Jesus use in Rev 22:13 meaning the Beginning and the End?", a: "Alpha and Omega" }
            ]
        };

        // State variables
        let teams = [
            { name: "Team 1", score: 0 },
            { name: "Team 2", score: 0 }
        ];

        let selectedBook = "";
        let selectedChapter = 0;
        let currentClueValue = 0;
        let activeCardElement = null;

        // Initialize UI
        function init() {
            renderTeams();
            populateBookGrids();
        }

        // Render Teams Bar
        function renderTeams() {
            const container = document.getElementById("teams-container");
            container.innerHTML = "";

            teams.forEach((team, idx) => {
                const teamEl = document.createElement("div");
                teamEl.className = "bg-slate-900 border border-slate-700 rounded-lg px-3 py-1 flex items-center gap-2 text-xs font-semibold shadow-sm";
                teamEl.innerHTML = `
                    <button onclick="renameTeam(${idx})" class="text-slate-200 hover:text-yellow-400 font-bold transition flex items-center gap-1 group" title="Click to rename team">
                        <span>${escapeHtml(team.name)}</span>
                        <span class="text-[10px] text-slate-500 group-hover:text-yellow-400">✏️</span>
                    </button>
                    <span class="text-yellow-400 font-extrabold font-mono">${team.score >= 0 ? '$' : '-$'}${Math.abs(team.score)}</span>
                    <button onclick="removeTeam(${idx})" class="text-slate-500 hover:text-red-400 font-bold ml-1 transition">✕</button>
                `;
                container.appendChild(teamEl);
            });
        }

        function addTeam() {
            const name = prompt("Enter new team name:", `Team ${teams.length + 1}`);
            if (name && name.trim() !== "") {
                teams.push({ name: name.trim(), score: 0 });
                renderTeams();
            }
        }

        function renameTeam(idx) {
            const newName = prompt(`Rename ${teams[idx].name}:`, teams[idx].name);
            if (newName && newName.trim() !== "") {
                teams[idx].name = newName.trim();
                renderTeams();
            }
        }

        function removeTeam(idx) {
            if (teams.length <= 1) {
                alert("You need at least one team.");
                return;
            }
            teams.splice(idx, 1);
            renderTeams();
        }

        // Populate Book Buttons (OT Left, NT Right)
        function populateBookGrids() {
            const otGrid = document.getElementById("ot-grid");
            const ntGrid = document.getElementById("nt-grid");

            for (let book in oldTestament) {
                otGrid.appendChild(createBookButton(book, oldTestament[book], 'ot'));
            }

            for (let book in newTestament) {
                ntGrid.appendChild(createBookButton(book, newTestament[book], 'nt'));
            }
        }

        function createBookButton(name, chapters, testament) {
            const btn = document.createElement("button");
            const colorClass = testament === 'ot' 
                ? "bg-slate-800/90 hover:bg-amber-600/20 hover:border-amber-500 text-amber-100" 
                : "bg-slate-800/90 hover:bg-cyan-600/20 hover:border-cyan-500 text-cyan-100";
            
            btn.className = `${colorClass} border border-slate-700/80 p-2.5 rounded-xl text-xs font-bold transition flex flex-col items-center justify-center gap-1 text-center shadow-sm hover:scale-[1.02]`;
            btn.innerHTML = `
                <span class="truncate w-full">${name}</span>
                <span class="text-[10px] opacity-60 font-medium">${chapters} Chs</span>
            `;
            btn.onclick = () => openChapterModal(name, chapters);
            return btn;
        }

        // Chapter Modal Logic
        function openChapterModal(bookName, chapterCount) {
            selectedBook = bookName;
            document.getElementById("modal-book-title").innerText = `${bookName}`;
            const grid = document.getElementById("chapter-grid");
            grid.innerHTML = "";

            for (let i = 1; i <= chapterCount; i++) {
                const btn = document.createElement("button");
                btn.className = "bg-slate-800 hover:bg-yellow-500 hover:text-slate-950 text-slate-200 border border-slate-700 font-bold p-3 rounded-lg text-sm transition";
                btn.innerText = i;
                btn.onclick = () => launchJeopardyGame(i);
                grid.appendChild(btn);
            }

            document.getElementById("chapter-modal").classList.remove("hidden");
        }

        function closeChapterModal() {
            document.getElementById("chapter-modal").classList.add("hidden");
        }

        // Launch Game Board
        function launchJeopardyGame(chapterNum) {
            selectedChapter = chapterNum;
            closeChapterModal();

            document.getElementById("selection-view").classList.add("hidden");
            document.getElementById("game-view").classList.remove("hidden");
            document.getElementById("active-game-title").innerText = `${selectedBook} ${selectedChapter}`;

            buildBoard();
        }

        function exitGame() {
            document.getElementById("game-view").classList.add("hidden");
            document.getElementById("selection-view").classList.remove("hidden");
        }

        // Build 3x3 Board Grid
        function buildBoard() {
            const board = document.getElementById("jeopardy-board");
            board.innerHTML = "";

            const categories = ["Key Events", "People & Words", "Chapter Details"];
            
            // Header Row
            categories.forEach(cat => {
                const header = document.createElement("div");
                header.className = "bg-slate-900 border-2 border-yellow-500/40 text-yellow-400 p-3 text-center font-extrabold text-xs sm:text-sm uppercase tracking-wider rounded-xl flex items-center justify-center shadow-md";
                header.innerText = cat;
                board.appendChild(header);
            });

            // Clues Data Source
            const key = `${selectedBook} ${selectedChapter}`;
            const specificSet = famousChaptersDatabase[key];

            const values = [100, 200, 300];

            values.forEach((val, valIdx) => {
                categories.forEach((cat, catIdx) => {
                    const card = document.createElement("div");
                    card.className = "clue-card bg-slate-900 border-2 border-slate-800 hover:border-yellow-500 text-yellow-400 font-black text-xl sm:text-2xl h-24 sm:h-28 rounded-xl flex items-center justify-center cursor-pointer transition transform hover:scale-105 shadow-lg gold-glow";
                    card.innerText = `$${val}`;
                    card.dataset.value = val;

                    let clueObj;
                    if (specificSet && specificSet[valIdx * 3 + catIdx]) {
                        clueObj = specificSet[valIdx * 3 + catIdx];
                    } else {
                        clueObj = generateBibleClue(selectedBook, selectedChapter, cat, val);
                    }

                    card.dataset.category = cat;
                    card.dataset.question = clueObj.q;
                    card.dataset.answer = clueObj.a;

                    card.onclick = () => openClueModal(card);
                    board.appendChild(card);
                });
            });
        }

        // Universal Bible Trivia Generator for every single book/chapter combination
        function generateBibleClue(book, chapter, category, value) {
            const isOT = !!oldTestament[book];
            const testamentName = isOT ? "Old Testament" : "New Testament";

            if (category === "Key Events") {
                if (value === 100) {
                    return {
                        q: `In which Testament of the Bible is ${book} Chapter ${chapter} located?`,
                        a: `The ${testamentName}`
                    };
                } else if (value === 200) {
                    return {
                        q: `What is the numerical chapter designation immediately following ${book} ${chapter}?`,
                        a: `${book} Chapter ${chapter + 1}`
                    };
                } else {
                    return {
                        q: `What general classification of biblical literature does the book of ${book} belong to?`,
                        a: isOT 
                            ? (chapter <= 5 ? "Law / Pentateuch" : "Historical or Prophetic Books") 
                            : (book.startsWith("Matthew") || book === "Mark" || book === "Luke" || book === "John" ? "Gospel Accounts" : "Epistles / New Testament Letters")
                    };
                }
            } else if (category === "People & Words") {
                if (value === 100) {
                    return {
                        q: `According to ${book} ${chapter}, what sacred text collection contains this specific chapter?`,
                        a: `The Holy Bible (Book of ${book})`
                    };
                } else if (value === 200) {
                    return {
                        q: `Name the key biblical book in which Chapter ${chapter} is situated.`,
                        a: `The Book of ${book}`
                    };
                } else {
                    return {
                        q: `In ${book} Chapter ${chapter}, who is the ultimate divine authority and protagonist worshipped throughout scripture?`,
                        a: `God (The Lord)`
                    };
                }
            } else { // Chapter Details
                if (value === 100) {
                    return {
                        q: `True or False: ${book} ${chapter} is part of the 66 canonical books of the Bible.`,
                        a: `True`
                    };
                } else if (value === 200) {
                    return {
                        q: `If you were reading ${book} Chapter ${chapter}, which testament are you currently studying?`,
                        a: `The ${testamentName}`
                    };
                } else {
                    return {
                        q: `How many total chapters are contained within the book of ${book}?`,
                        a: `${isOT ? oldTestament[book] : newTestament[book]} Chapters`
                    };
                }
            }
        }

        // Open Clue Modal
        function openClueModal(card) {
            if (card.classList.contains("disabled")) return;

            activeCardElement = card;
            currentClueValue = parseInt(card.dataset.value);

            document.getElementById("clue-category-badge").innerText = card.dataset.category;
            document.getElementById("clue-value-badge").innerText = `$${currentClueValue}`;
            document.getElementById("clue-question").innerText = card.dataset.question;
            document.getElementById("clue-answer").innerText = card.dataset.answer;

            document.getElementById("answer-box").classList.add("hidden");
            document.getElementById("show-answer-btn").classList.remove("hidden");
            document.getElementById("scoring-panel").classList.add("hidden");

            document.getElementById("clue-modal").classList.remove("hidden");
        }

        function revealAnswer() {
            document.getElementById("answer-box").classList.remove("hidden");
            document.getElementById("show-answer-btn").classList.add("hidden");

            // Build Team Score Buttons
            const btnContainer = document.getElementById("team-score-buttons");
            btnContainer.innerHTML = "";

            teams.forEach((team, idx) => {
                const group = document.createElement("div");
                group.className = "flex items-center gap-1 bg-slate-950 p-1.5 rounded-xl border border-slate-800";
                group.innerHTML = `
                    <span class="text-xs font-bold text-slate-300 px-2">${escapeHtml(team.name)}:</span>
                    <button onclick="awardScore(${idx}, true)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold px-3 py-1.5 rounded-lg text-xs transition">
                        + $${currentClueValue}
                    </button>
                    <button onclick="awardScore(${idx}, false)" class="bg-rose-600 hover:bg-rose-500 text-white font-extrabold px-3 py-1.5 rounded-lg text-xs transition">
                        - $${currentClueValue}
                    </button>
                `;
                btnContainer.appendChild(group);
            });

            document.getElementById("scoring-panel").classList.remove("hidden");
            document.getElementById("scoring-panel").classList.add("flex");
        }

        function awardScore(teamIdx, isCorrect) {
            if (isCorrect) {
                teams[teamIdx].score += currentClueValue;
            } else {
                teams[teamIdx].score -= currentClueValue;
            }
            renderTeams();
        }

        function closeClueModal() {
            if (activeCardElement) {
                activeCardElement.classList.add("disabled", "opacity-20", "cursor-not-allowed", "hover:scale-100", "border-transparent");
                activeCardElement.innerText = "";
                activeCardElement.onclick = null;
            }
            document.getElementById("clue-modal").classList.add("hidden");
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // Initialize application on load
        window.onload = init;
    </script>
</body>
</html>
