<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Jeopardy</title>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --bg-card: #151c2c;
            --accent-ot: #c97a2b;
            --accent-nt: #2b8ac9;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --gold: #ffcc00;
            --correct: #28a745;
            --wrong: #dc3545;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #060910;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #222e45;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 1px;
            color: var(--gold);
        }

        .score-board {
            background: #101622;
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            border: 1px solid var(--gold);
        }

        .container {
            flex: 1;
            padding: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Nav Breadcrumbs */
        .breadcrumbs {
            margin-bottom: 1rem;
            display: flex;
            gap: 10px;
            align-items: center;
            color: var(--text-muted);
        }

        .breadcrumbs button {
            background: none;
            border: none;
            color: var(--gold);
            cursor: pointer;
            font-size: 1rem;
            text-decoration: underline;
        }

        /* OT / NT Layout */
        .testaments-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            flex: 1;
        }

        .testament-column {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #222e45;
            display: flex;
            flex-direction: column;
        }

        .ot-header { color: var(--accent-ot); border-bottom: 2px solid var(--accent-ot); margin-bottom: 1rem; padding-bottom: 0.5rem; }
        .nt-header { color: var(--accent-nt); border-bottom: 2px solid var(--accent-nt); margin-bottom: 1rem; padding-bottom: 0.5rem; }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
        }

        .book-btn {
            background: #1d273b;
            border: 1px solid #2d3d5c;
            color: var(--text-main);
            padding: 0.8rem 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-size: 0.9rem;
        }

        .book-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .ot-column .book-btn:hover { border-color: var(--accent-ot); background: #2a1f18; }
        .nt-column .book-btn:hover { border-color: var(--accent-nt); background: #18232e; }

        /* Chapter Selection */
        .chapter-selection-view {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
        }

        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 12px;
            margin-top: 1.5rem;
        }

        .chapter-btn {
            background: #1d273b;
            border: 1px solid #2d3d5c;
            color: var(--text-main);
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .chapter-btn:hover {
            background: var(--gold);
            color: #000;
        }

        /* Jeopardy Board Layout */
        .jeopardy-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            flex: 1;
        }

        .category-card {
            background: #0f2a4a;
            color: white;
            text-align: center;
            padding: 1rem 0.5rem;
            font-weight: bold;
            border-radius: 6px;
            border: 2px solid #1f4b82;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            font-size: 0.95rem;
        }

        .clue-card {
            background: #0d223d;
            border: 2px solid #1f4b82;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: var(--gold);
            cursor: pointer;
            min-height: 90px;
            transition: 0.2s;
        }

        .clue-card:hover:not(.disabled) {
            background: #183863;
            transform: scale(1.02);
        }

        .clue-card.disabled {
            background: #08121e;
            border-color: #112236;
            color: #1d334d;
            cursor: default;
        }

        /* Modal Popup for Questions */
        .modal-overlay {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 100;
        }

        .modal {
            background: var(--bg-card);
            border: 2px solid var(--gold);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            border-bottom: 1px solid #222e45;
            padding-bottom: 0.5rem;
        }

        .modal-clue {
            font-size: 1.25rem;
            line-height: 1.5;
            text-align: center;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: #1d273b;
            border: 1px solid #2d3d5c;
            color: var(--text-main);
            padding: 1rem;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        .option-btn:hover {
            background: #2a3a57;
        }

        .option-btn.correct { background: var(--correct) !important; color: white; }
        .option-btn.wrong { background: var(--wrong) !important; color: white; }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .testaments-container { grid-template-columns: 1fr; }
            .jeopardy-board { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<body>

    <h1>Bible Chapter Jeopardy</h1>

    <!-- Main Testament View -->
    <div id="selection-view" class="container">
        <!-- Old Testament (Left) -->
        <div class="testament-col">
            <h2>Old Testament</h2>
            <div id="ot-grid" class="book-grid"></div>
        </div>
        
        <!-- New Testament (Right) -->
        <div class="testament-col">
            <h2>New Testament</h2>
            <div id="nt-grid" class="book-grid"></div>
        </div>
    </div>

    <!-- Chapter Selection Modal -->
    <div id="chapter-modal" class="overlay">
        <div class="modal">
            <h2 id="modal-book-title">Select Chapter</h2>
            <div id="chapter-grid" class="chapter-grid"></div>
            <button class="btn-close" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <!-- Jeopardy Board View -->
    <div id="jeopardy-view" style="display: none;">
        <div class="game-header">
            <button class="btn-close" style="margin: 0;" onclick="exitGame()">← Back to Books</button>
            <h2 id="game-title" style="margin: 0; color: #f1c40f;"></h2>
            <div>Score: $<span id="score">0</span></div>
        </div>
        <div class="board" id="board"></div>
    </div>

    <!-- Question Modal -->
    <div id="clue-modal" class="overlay">
        <div class="modal">
            <h3 id="clue-value" style="color:#f1c40f;"></h3>
            <p id="clue-text" style="font-size: 18px; margin: 20px 0;"></p>
            <div id="answer-section" style="display:none;">
                <p id="answer-text" style="color: #4ecca3; font-weight: bold;"></p>
            </div>
            <button id="show-answer-btn" class="book-btn" onclick="revealAnswer()">Show Answer</button>
            <div id="score-btns" style="display:none; margin-top:15px; gap: 10px; justify-content: center;">
                <button class="book-btn" style="background:#27ae60;" onclick="adjustScore(true)">Correct (+)</button>
                <button class="book-btn" style="background:#c0392b;" onclick="adjustScore(false)">Incorrect (-)</button>
            </div>
        </div>
    </div>

    <script>
        // Books Data (Book Name: Total Chapters)
        const oldTestament = {
            "Genesis": 50, "Exodus": 40, "Leviticus": 27, "Numbers": 36, "Deuteronomy": 34,
            "Joshua": 24, "Judges": 21, "Ruth": 4, "1 Samuel": 31, "2 Samuel": 24,
            "1 Kings": 22, "2 Kings": 25, "1 Chronicles": 29, "2 Chronicles": 36, "Ezra": 10,
            "Nehemiah": 13, "Esther": 10, "Job": 42, "Psalms": 150, "Proverbs": 31,
            "Ecclesiastes": 12, "Song of Solomon": 8, "Isaiah": 66, "Jeremiah": 52, "Lamentations": 5,
            "Ezekiel": 48, "Daniel": 12, "Hosea": 14, "Joel": 3, "Amos": 9,
            "Obadiah": 1, "Jonah": 4, "Micah": 7, "Nahum": 3, "Habakkuk": 3,
            "Zephaniah": 3, "Haggai": 2, "Zechariah": 14, "Malachi": 4
        };

        const newTestament = {
            "Matthew": 28, "Mark": 16, "Luke": 24, "John": 21, "Acts": 28,
            "Romans": 16, "1 Corinthians": 16, "2 Corinthians": 13, "Galatians": 6, "Ephesians": 6,
            "Philippians": 4, "Colossians": 4, "1 Thessalonians": 5, "2 Thessalonians": 3, "1 Timothy": 6,
            "2 Timothy": 4, "Titus": 3, "Philemon": 1, "Hebrews": 13, "James": 5,
            "1 Peter": 5, "2 Peter": 3, "1 John": 5, "2 John": 1, "3 John": 1,
            "Jude": 1, "Revelation": 22
        };

        let selectedBook = "";
        let selectedChapter = 0;
        let currentScore = 0;
        let currentClueValue = 0;
        let activeCardElement = null;

        // Initialize Book Buttons
        function init() {
            const otGrid = document.getElementById("ot-grid");
            const ntGrid = document.getElementById("nt-grid");

            for (let book in oldTestament) {
                otGrid.appendChild(createBookButton(book, oldTestament[book]));
            }
            for (let book in newTestament) {
                ntGrid.appendChild(createBookButton(book, newTestament[book]));
            }
        }

        function createBookButton(name, chapters) {
            const btn = document.createElement("button");
            btn.className = "book-btn";
            btn.innerText = name;
            btn.onclick = () => openChapterModal(name, chapters);
            return btn;
        }

        // Modal Handlers
        function openChapterModal(bookName, chapterCount) {
            selectedBook = bookName;
            document.getElementById("modal-book-title").innerText = `${bookName} - Select Chapter`;
            const grid = document.getElementById("chapter-grid");
            grid.innerHTML = "";

            for (let i = 1; i <= chapterCount; i++) {
                const btn = document.createElement("button");
                btn.className = "chapter-btn";
                btn.innerText = i;
                btn.onclick = () => startGame(i);
                grid.appendChild(btn);
            }

            document.getElementById("chapter-modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("chapter-modal").style.display = "none";
        }

        // Jeopardy Game Initialization
        function startGame(chapter) {
            selectedChapter = chapter;
            closeModal();
            
            document.getElementById("selection-view").style.display = "none";
            document.getElementById("jeopardy-view").style.display = "block";
            document.getElementById("game-title").innerText = `${selectedBook} ${selectedChapter}`;
            
            currentScore = 0;
            updateScoreDisplay();
            buildBoard();
        }

        function exitGame() {
            document.getElementById("jeopardy-view").style.display = "none";
            document.getElementById("selection-view").style.display = "flex";
        }

        // Generate Board Layout & Mock Data Generator for any selected chapter
        function buildBoard() {
            const board = document.getElementById("board");
            board.innerHTML = "";

            const categories = ["Key Events", "People & Places", "Key Details"];
            
            // Header Row
            categories.forEach(cat => {
                const header = document.createElement("div");
                header.className = "category-header";
                header.innerText = cat;
                board.appendChild(header);
            });

            // Grid Cards ($100 to $300)
            const values = [100, 200, 300];
            values.forEach(val => {
                categories.forEach((cat, index) => {
                    const card = document.createElement("div");
                    card.className = "clue-card";
                    card.innerText = `$${val}`;
                    
                    // Attach Clue Data dynamically
                    card.dataset.value = val;
                    card.dataset.clue = `[${cat} $${val}] Question prompt regarding key elements in ${selectedBook} Chapter ${selectedChapter}.`;
                    card.dataset.answer = `What/Who is the main answer associated with ${selectedBook} ${selectedChapter}?`;
                    
                    card.onclick = () => openClue(card);
                    board.appendChild(card);
                });
            });
        }

        // Clue Display Logic
        function openClue(card) {
            if (card.classList.contains("disabled")) return;
            
            activeCardElement = card;
            currentClueValue = parseInt(card.dataset.value);

            document.getElementById("clue-value").innerText = `$${currentClueValue}`;
            document.getElementById("clue-text").innerText = card.dataset.clue;
            document.getElementById("answer-text").innerText = card.dataset.answer;
            
            document.getElementById("answer-section").style.display = "none";
            document.getElementById("show-answer-btn").style.display = "inline-block";
            document.getElementById("score-btns").style.display = "none";

            document.getElementById("clue-modal").style.display = "flex";
        }

        function revealAnswer() {
            document.getElementById("answer-section").style.display = "block";
            document.getElementById("show-answer-btn").style.display = "none";
            document.getElementById("score-btns").style.display = "flex";
        }

        function adjustScore(isCorrect) {
            if (isCorrect) {
                currentScore += currentClueValue;
            } else {
                currentScore -= currentClueValue;
            }
            updateScoreDisplay();

            // Disable card on board
            if (activeCardElement) {
                activeCardElement.classList.add("disabled");
                activeCardElement.innerText = "";
                activeCardElement.onclick = null;
            }

            document.getElementById("clue-modal").style.display = "none";
        }

        function updateScoreDisplay() {
            document.getElementById("score").innerText = currentScore;
        }

        // Run application
        init();
    </script>
</body>
</html>
